# Transit411 engine: NTD data + Ask NTD API (phase 1), Postgres/pgvector + Command Center (phase 2).
#
# Naming: the project name below prefixes everything Compose creates for this project:
# containers (transit411-<service>-1), the network (transit411_default) and built images
# (transit411-<service>). New services added to this file get the prefix automatically,
# so name services plainly (e.g. "collector", not "transit411-collector").
name: transit411

services:
  # One-shot: fetch real NTD data and (re)build the database. Run on demand:
  #   docker compose run --rm ingest
  ingest:
    build: .
    profiles: ["tools"]
    environment:
      - NTD_DB=/data/ntd.duckdb
    volumes:
      - ${DATA_DIR:-/share/Container/transit411/data}:/data
    command: ["python", "build_db.py", "--db", "/data/ntd.duckdb"]

  # Always-on: the read-only Ask NTD API. LAN-only; front with Cloudflare Tunnel to go public.
  api:
    build: .
    restart: unless-stopped
    environment:
      - NTD_DB=/data/ntd.duckdb
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ASK_NTD_MODEL=${ASK_NTD_MODEL:-claude-haiku-4-5}
    volumes:
      - ${DATA_DIR:-/share/Container/transit411/data}:/data
    ports:
      - "8000:8000"

  # Content store: Postgres + pgvector (collection queue, sources, posts, subscribers).
  # No published port: only the other containers can reach it.
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=transit411
      - POSTGRES_PASSWORD=${DB_PASSWORD:-transit411}
      - POSTGRES_DB=transit411
    volumes:
      - ${DATA_DIR:-/share/Container/transit411/data}/postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # The private home-base dashboard (LAN only). Published on 8088 because QNAP's own admin UI owns 8080.
  command-center:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "command_center:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      - API_URL=http://api:8000
      - DATABASE_URL=postgresql://transit411:${DB_PASSWORD:-transit411}@db:5432/transit411
      - CIG_PDF_DIR=/data/cig
      - CIG_PROFILE_DIR=/data/cig_profiles
      # Ask CIG turns questions into SQL itself (the Ask NTD API does its own), so it needs the key too.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ASK_NTD_MODEL=${ASK_NTD_MODEL:-claude-haiku-4-5}
      # Cloudflare Pages deploy hook (secret URL): publishing/unpublishing rebuilds the public site.
      - CF_PAGES_DEPLOY_HOOK=${CF_PAGES_DEPLOY_HOOK:-}
    volumes:
      # Kept copies of every loaded CIG dashboard PDF (Grants tab > Dashboard files).
      - ${DATA_DIR:-/share/Container/transit411/data}/cig:/data/cig
      # Archived versions of every project's FTA profile PDF (and the inbox for new downloads).
      - ${DATA_DIR:-/share/Container/transit411/data}/cig_profiles:/data/cig_profiles
    ports:
      - "8088:8080"
    depends_on:
      - api
      - db

  # Collector: fetch sources, summarize, score freshness, write pending items to Postgres.
  #   docker compose run --rm collect --seed     (once)
  #   docker compose run --rm collect --run
  collect:
    build: .
    profiles: ["tools"]
    environment:
      - DATABASE_URL=postgresql://transit411:${DB_PASSWORD:-transit411}@db:5432/transit411
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - COLLECT_MODEL=${COLLECT_MODEL:-claude-haiku-4-5}
    depends_on:
      - db
    entrypoint: ["python", "collection.py"]

  # Always-on: runs the collector daily at COLLECT_AT (COLLECT_TZ). Skips the run, spending no model
  # tokens, while the Command Center's Auto-collect toggle is off.
  scheduler:
    build: .
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://transit411:${DB_PASSWORD:-transit411}@db:5432/transit411
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - COLLECT_MODEL=${COLLECT_MODEL:-claude-haiku-4-5}
      - COLLECT_AT=${COLLECT_AT:-06:00}
      - COLLECT_TZ=${COLLECT_TZ:-America/New_York}
    depends_on:
      - db
    entrypoint: ["python", "collection.py", "--schedule"]

  # CIG pipeline: load the FTA Capital Investment Grants dashboard into Postgres.
  #   docker compose run --rm cig --latest          # newest dashboard (transit.dot.gov currently blocks this)
  #   docker compose run --rm cig --url https://...  # a specific / archived month (backfill history)
  # Usually loaded with Upload dashboard on the Command Center's Grants tab instead.
  # Each snapshot is kept, so the table builds month-by-month history.
  cig:
    build: .
    profiles: ["tools"]
    environment:
      - DATABASE_URL=postgresql://transit411:${DB_PASSWORD:-transit411}@db:5432/transit411
      - CIG_PDF_DIR=/data/cig
    volumes:
      - ${DATA_DIR:-/share/Container/transit411/data}/cig:/data/cig
    depends_on:
      - db
    entrypoint: ["python", "cig.py"]

  # CIG project profile archive: every version of each project's FTA profile PDF, with diffs.
  #   docker compose run --rm cig-profiles --listing /data/cig_profiles/inbox/<saved page>.html
  #   docker compose run --rm cig-profiles --weekly     # inbox + one try of FTA's listing page
  # The scheduler runs the weekly check; the Grants tab has upload buttons for pages and PDFs.
  cig-profiles:
    build: .
    profiles: ["tools"]
    environment:
      - DATABASE_URL=postgresql://transit411:${DB_PASSWORD:-transit411}@db:5432/transit411
      - CIG_PDF_DIR=/data/cig
      - CIG_PROFILE_DIR=/data/cig_profiles
    volumes:
      - ${DATA_DIR:-/share/Container/transit411/data}/cig:/data/cig
      - ${DATA_DIR:-/share/Container/transit411/data}/cig_profiles:/data/cig_profiles
    depends_on:
      - db
    entrypoint: ["python", "cig_profiles.py"]

  # Read-only public API: the ONLY thing the Cloudflare tunnel exposes. It allowlists the safe
  # read/ask endpoints and forwards them to the Command Center; everything else returns 404.
  # No published port: reachable only by the tunnel (and the other containers).
  readonly-api:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "readonly_api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - UPSTREAM_URL=http://command-center:8080
      # Limits for the two model-backed "ask" endpoints (each question costs an Anthropic call).
      - PUBLIC_ASK_ENABLED=${PUBLIC_ASK_ENABLED:-true}
      - ASK_PER_IP_HOUR=${ASK_PER_IP_HOUR:-20}
      - ASK_PER_DAY=${ASK_PER_DAY:-200}
      - ASK_MAX_CHARS=${ASK_MAX_CHARS:-500}
    networks: [default, public]
    depends_on:
      - command-center

  # Cloudflare Tunnel: dials out to Cloudflare (no open ports) and serves your public API hostname.
  # Put the tunnel token in .env as CLOUDFLARE_TUNNEL_TOKEN. In the Cloudflare dashboard, set the
  # tunnel's Public Hostname (e.g. api.transit411.com) to service http://readonly-api:8000.
  # It sits on its own "public" network with readonly-api only, so a hostname misconfigured in the
  # dashboard still can't reach the Command Center, the database or the NTD API.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}   # env var, so the token isn't in the NAS's process list
    networks: [public]
    depends_on:
      - readonly-api

networks:
  public: {}
